<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <!-- Authentic Majsoul Azure Blue (苍蓝) Vibrant Gradient -->
    <linearGradient id="cangLanBody" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="35%" stop-color="#1976d2" />
      <stop offset="70%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <!-- Top-Left Soft Luminous Highlight -->
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0.5" y2="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bevel Rim with Azure Ceramic Sheen -->
    <linearGradient id="bevelRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90caf9" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#42a5f5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0a2e66" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner Micro Tile Texture -->
    <pattern id="riichiPebble" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 Q 4 4 8 8 T 16 8" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Main Tile Back Body with Rounded Porcelain Corners -->
  <rect x="2" y="2" width="296" height="396" rx="36" ry="36" fill="url(#cangLanBody)" />

  <!-- Matte Micro Texture -->
  <rect x="2" y="2" width="296" height="396" rx="36" ry="36" fill="url(#riichiPebble)" />

  <!-- Beveled Outer Edge Stroke -->
  <rect x="2" y="2" width="296" height="396" rx="36" ry="36" fill="none" stroke="url(#bevelRim)" stroke-width="4" />

  <!-- Top Specular Ceramic Glaze Curve -->
  <path d="M 14 50 C 14 30 30 14 52 12 C 110 8 190 8 248 12 C 270 14 286 30 286 50 C 286 110 220 160 120 160 C 45 160 14 110 14 50 Z" fill="url(#topHighlight)" />

  <!-- Inner Recessed Framing -->
  <rect x="24" y="24" width="252" height="352" rx="22" ry="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18" />
</svg>