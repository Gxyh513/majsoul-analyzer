<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <!-- Obsidian Charcoal Gradient -->
    <linearGradient id="darkBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="50%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>

    <!-- Top Specular Highlight -->
    <linearGradient id="darkHighlight" x1="0" y1="0" x2="0.6" y2="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bevel Rim -->
    <linearGradient id="darkBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48484a" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#2c2c2e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Main Tile Back Body with Apple Rounded Corners -->
  <rect x="2" y="2" width="296" height="396" rx="36" ry="36" fill="url(#darkBody)" />

  <!-- Beveled Outer Edge Stroke -->
  <rect x="2" y="2" width="296" height="396" rx="36" ry="36" fill="none" stroke="url(#darkBevel)" stroke-width="4" />

  <!-- Top Curved Specular Glaze -->
  <path d="M 12 50 C 12 30 28 14 50 12 C 110 8 190 8 250 12 C 272 14 288 30 288 50 C 288 120 220 180 120 180 C 40 180 12 120 12 50 Z" fill="url(#darkHighlight)" />

  <!-- Inner Recessed Framing -->
  <rect x="24" y="24" width="252" height="352" rx="22" ry="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />
</svg>
