<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <!-- Soft warm porcelain ambient lighting -->
    <linearGradient id="porcelainSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#fafaf9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f4f4f5" stop-opacity="0.35" />
    </linearGradient>

    <!-- Gentle top-left lighting bevel -->
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Micro inner bevel stroke -->
    <linearGradient id="innerEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Central Inner Beveled Platform (Pure Elegant Bone-China Surface) -->
  <rect x="42" y="52" width="216" height="296" rx="20" ry="20" fill="url(#porcelainSheen)" />

  <!-- Soft porcelain micro-contour (Neutral soft ivory-white, zero blue) -->
  <rect x="44" y="54" width="212" height="292" rx="18" ry="18" fill="none" stroke="url(#innerEdge)" stroke-width="2.5" />

  <!-- Subtle inner ambient reflection -->
  <rect x="48" y="58" width="204" height="284" rx="14" ry="14" fill="none" stroke="url(#bevelLight)" stroke-width="1.2" opacity="0.6" />
</svg>
