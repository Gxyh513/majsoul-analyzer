<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>牌谱检讨 · 雀魂 AI 复盘</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='2' width='24' height='28' rx='4' fill='%23ffffff' stroke='%2330d158' stroke-width='2'/><rect x='8' y='6' width='16' height='20' rx='2' fill='%231a7940'/></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ========================================================================
       Tier 1: Minimal Landing Page
       ======================================================================== -->
  <section id="tier1Screen" class="kd-tier1">
    <div class="kd-landing-card">
      <div class="kd-avatar-wrap">
        <img src="/avatar.png" alt="GitHub Avatar" class="kd-avatar" />
      </div>

      <div>
        <h1 class="kd-landing-title">雀魂牌谱 AI 检讨</h1>
      </div>

      <div class="kd-landing-form">
        <input id="homePaipuInput" class="kd-landing-input" type="text"
          placeholder="粘贴雀魂牌谱链接或牌谱号，回车即可开始..."
          autocomplete="off" spellcheck="false" aria-label="牌谱链接" />

        <div class="kd-model-group">
          <button type="button" class="kd-model-btn active" data-model="akagi" id="btnModelAkagi">
            <span>赤木 Akagi (v4)</span>
            <span style="font-size:11px; opacity:0.75;">582k步 进攻强化</span>
          </button>
          <button type="button" class="kd-model-btn" data-model="mortal" id="btnModelMortal">
            <span>Mortal 核心 (v3)</span>
            <span style="font-size:11px; opacity:0.75;">天凤十段 平衡型</span>
          </button>
        </div>

        <button id="btnHomeAnalyze" class="kd-landing-submit">开始分析</button>
      </div>
    </div>
  </section>

  <!-- ========================================================================
       Tier 2: Review Screen (KillerDucky Mahjong Board)
       ======================================================================== -->
  <section id="tier2Screen" class="kd-tier2 hidden">
    <!-- Top Header -->
    <header class="kd-header">
      <!-- Tier 1: Global Toolbar (Brand, Seats & Preferences) -->
      <div class="kd-header-row kd-header-top">
        <div class="kd-header-left">
          <button id="btnBackToHome" class="kd-back-btn" title="返回首页重新输入牌谱">← 检讨新牌谱</button>
          <div id="seatTabs" class="kd-seat-tabs"></div>
        </div>

        <div class="kd-header-right">
          <select id="themeSelect" class="kd-kyoku-select" title="切换界面与牌桌主题" style="padding:5px 8px; font-size:12px; background:rgba(255,255,255,0.08); border-radius:18px;">
            <option value="apple-dark">深空暗黑</option>
            <option value="majsoul-green">雀庄翠绿</option>
            <option value="midnight-navy">深海藏青</option>
            <option value="true-black">极夜纯黑</option>
          </select>
          <button id="btnToggleHideId" class="kd-chip-btn" title="切换是否隐藏玩家ID与昵称">隐藏ID</button>
          <button id="btnToggleHands" class="kd-chip-btn" title="切换别家明牌/暗牌 (快捷键 H)">
            <span id="toggleHandsText">明牌</span>
          </button>
          <button id="btnOpenEngineModal" class="kd-chip-btn" title="点击切换分析模型">
            <span id="engineStatusText">赤木 Akagi · CPU</span>
          </button>
          <div id="gameSummaryPill" class="kd-match-badge" title="点击查看全庄得点表">AI 一致率: --%</div>
        </div>
      </div>

      <!-- Tier 2: Step Controller & Timeline Scrubber Bar -->
      <div class="kd-header-row kd-header-bottom">
        <div class="kd-step-left">
          <select id="kyokuSelect" class="kd-kyoku-select" title="直接切换局数"></select>
        </div>

        <div class="kd-step-mid">
          <button id="btnPlayPause" class="kd-play-btn" title="自动播放/暂停 (空格键)">播放</button>
          <span id="stepCounterText" class="kd-step-counter">0 / 0</span>
          <input id="stepSlider" type="range" min="0" max="0" value="0" class="kd-slider" aria-label="回放进度" />
        </div>
      </div>
    </header>

    <!-- Main Board & Sidebar -->
    <main>
      <div class="outer">
        <!-- 655x735 Mahjong Board Grid -->
        <div class="grid-main" id="gridMain">
          <!-- P0 (Bottom / Hero) Hand Container with Discard Probability Bars -->
          <span class="grid-hand-p0-container" title="点击可切换对手明牌/暗牌">
            <span id="discard-bars" class="discard-bars">
              <svg id="discardBarsSvg" class="discard-bars-svg"></svg>
            </span>
            <span class="grid-hand pov-p0 grid-hand-p0">
              <span class="pov-p0 hand-closed-p0" id="handBottomClosed"></span>
              <span class="pov-p0 hand-calls-p0" id="handBottomCalls"></span>
            </span>
          </span>

          <!-- P3 (Left / Kami) Hand -->
          <span class="grid-hand pov-p3 grid-hand-p3" title="点击切换明牌/暗牌">
            <span class="pov-p3 hand-closed-p3" id="handLeftClosed"></span>
            <span class="pov-p3 hand-calls-p3" id="handLeftCalls"></span>
          </span>

          <!-- P2 (Top / Toimen) Hand -->
          <span class="grid-hand pov-p2 grid-hand-p2" title="点击切换明牌/暗牌">
            <span class="pov-p2 hand-closed-p2" id="handTopClosed"></span>
            <span class="pov-p2 hand-calls-p2" id="handTopCalls"></span>
          </span>

          <!-- P1 (Right / Shimo) Hand -->
          <span class="grid-hand pov-p1 grid-hand-p1" title="点击切换明牌/暗牌">
            <span class="pov-p1 hand-closed-p1" id="handRightClosed"></span>
            <span class="pov-p1 hand-calls-p1" id="handRightCalls"></span>
          </span>

          <!-- 4 Discard Rivers -->
          <span class="grid-discard pov-p0 grid-discard-p0" id="riverBottom"></span>
          <span class="grid-discard pov-p1 grid-discard-p1" id="riverRight"></span>
          <span class="grid-discard pov-p2 grid-discard-p2" id="riverTop"></span>
          <span class="grid-discard pov-p3 grid-discard-p3" id="riverLeft"></span>

          <!-- Center 200x200 Info Square -->
          <div class="grid-info" id="gridInfo">
            <button class="info-round" id="btnRoundScore" title="点击查看局数得点表">东1</button>
            <span class="info-tiles-left" id="centerTilesLeft">x69</span>
            <span class="info-honbas" id="centerHonba"></span>
            <span class="info-doras" id="centerDoras"></span>
            <span class="gi-p0-outer"><span class="gi-p0" id="giP0">西 25000</span></span>
            <span class="gi-p1-outer"><span class="gi-p1" id="giP1">北 25000</span></span>
            <span class="gi-p2-outer"><span class="gi-p2" id="giP2">东 25000</span></span>
            <span class="gi-p3-outer"><span class="gi-p3" id="giP3">南 25000</span></span>
          </div>
        </div>

        <!-- Right Sidebar (Controls, Decision Details, Shortcuts) -->
        <div class="sidebar">

          <!-- 8 Navigation Buttons -->
          <div class="controls">
            <button id="btnPrevKyoku">&lt; 上一局</button>
            <button id="btnNextKyoku">下一局 &gt;</button>
            <button id="btnPrevDec">&lt; 上一切牌</button>
            <button id="btnNextDec">下一切牌 &gt;</button>
            <button id="btnPrevBlunder">&lt; 上一错误</button>
            <button id="btnNextBlunder">下一错误 &gt;</button>
            <button id="btnPrevStep">&lt; 后退</button>
            <button id="btnNextStep">前进 &gt;</button>
          </div>

          <!-- Active Decision Details Card -->
          <div class="kd-decision-card" id="decisionCard">
            <div class="kd-dec-header">
              <span id="decVerdictBadge" class="kd-dec-verdict best">模型一致</span>
              <span id="decTurnText" class="kd-dec-turn-title" style="display:none;"></span>
            </div>

            <!-- Vertical Large Decision Comparison Cards: Player Choice on Top, AI on Bottom -->
            <div class="kd-hero-compare-vertical">
              <!-- 1. Actual Player Choice (On Top) -->
              <div class="kd-choice-block kd-choice-actual">
                <div class="kd-choice-badge-label">玩家切</div>
                <div class="kd-choice-content">
                  <div id="decActualTileWrap" class="kd-choice-tile-wrap"></div>
                </div>
              </div>

              <!-- 2. AI Recommended Choice (On Bottom) -->
              <div class="kd-choice-block kd-choice-ai">
                <div class="kd-choice-badge-label">模型切</div>
                <div class="kd-choice-content">
                  <div id="decAiTileWrap" class="kd-choice-tile-wrap"></div>
                </div>
              </div>
            </div>

            <!-- Candidates Table with Legible Sized Tiles -->
            <div class="kd-cand-section-title">候选舍牌 AI 评分明细</div>
            <table class="kd-cand-table">
              <thead>
                <tr>
                  <th style="width:48px;">动作</th>
                  <th>牌面</th>
                  <th>模型权重</th>
                  <th>向听</th>
                  <th>进张</th>
                </tr>
              </thead>
              <tbody id="decCandTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Right Column 2: Secondary Sidebar (Shortcuts & Theme Cards on the Right) -->
        <div class="sidebar-secondary">
          <!-- Standalone Prominent Keyboard Shortcuts Card on the Right -->
          <div class="kd-shortcuts-card" id="shortcutsCard">
            <div class="kd-shortcuts-title">快捷操作速查</div>
            <table class="kd-shortcuts-table">
              <tbody>
                <tr><td><code>空格</code></td><td>自动播放 / 暂停</td></tr>
                <tr><td><code>←</code> <code>→</code></td><td>后退 / 前进一步</td></tr>
                <tr><td><code>↑</code> <code>↓</code></td><td>上 / 下一切牌决策</td></tr>
                <tr><td><code>,</code> <code>.</code></td><td>上 / 下一错误手</td></tr>
                <tr><td><code>[</code> <code>]</code></td><td>上一局 / 下一局</td></tr>
                <tr><td><code>h</code></td><td>开关别家明牌/暗牌</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Appearance & Tile Back Customizer Card -->
          <div class="kd-shortcuts-card kd-appearance-card">
            <div class="kd-shortcuts-title">视觉主题与外观</div>
            <div style="font-size:12px; margin-bottom:6px; color:var(--color-text-secondary);">牌桌主题配色</div>
            <select id="themeSelectCard" class="kd-kyoku-select" style="width:100%; margin-bottom:12px; padding:6px 10px; font-size:12px;">
              <option value="apple-dark">深空暗黑 (Apple Dark 默认)</option>
              <option value="majsoul-green">经典雀庄翠绿 (Majsoul Green)</option>
              <option value="midnight-navy">深海藏青 (Midnight Navy)</option>
              <option value="true-black">极夜 OLED 纯黑 (True Black)</option>
            </select>
            <div style="font-size:12px; margin-bottom:6px; color:var(--color-text-secondary);">暗牌背面颜色</div>
            <select id="backSelectCard" class="kd-kyoku-select" style="width:100%; padding:6px 10px; font-size:12px;">
              <option value="auto">随主题自动适配 (推荐)</option>
              <option value="back-red">经典赤红 (保留原版)</option>
              <option value="back-navy">沉稳藏青 (低饱和深海)</option>
              <option value="back-green">翡翠竹青 (雅致墨玉)</option>
              <option value="back-dark">曜石深灰 (深空高级感)</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </section>

  <!-- Modal: Round Scores Table -->
  <div id="roundModalBackdrop" class="modal-backdrop hidden"></div>
  <div id="roundModal" class="modal hidden">
    <button id="roundModalClose" class="close">×</button>
    <div class="round-modal-header" style="margin-bottom:12px;">
      <h3 style="margin-bottom:4px; font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;">
        <span>全庄得点变动与 AI 一致率表</span>
      </h3>
      <div id="roundModalSub" style="font-size:12px; color:var(--color-text-secondary); margin-bottom:10px;"></div>
      <div id="roundModalPovTabs" class="round-modal-pov-tabs"></div>
    </div>
    <div class="info-round-table">
      <table id="roundTable">
        <thead id="roundTableHead"></thead>
        <tbody id="roundTableBody"></tbody>
        <tfoot id="roundTableFoot"></tfoot>
      </table>
    </div>
  </div>

  <!-- Modal: Engine Switcher -->
  <div id="engineModalBackdrop" class="modal-backdrop hidden"></div>
  <div id="engineModal" class="modal hidden">
    <button id="engineModalClose" class="close">×</button>
    <h3 style="margin-bottom:12px; font-size:16px;">切换 AI 推理模型</h3>
    <div id="engineModalDetail" style="font-size:12px; line-height:1.8; margin-bottom:14px; background:var(--color-main); padding:10px; border-radius:4px;"></div>
    <div style="display:flex; flex-direction:column; gap:10px; font-size:13px;">
      <label>
        <div>选择分析模型：</div>
        <select id="engineSelect" style="width:100%; margin-top:4px; padding:6px;"></select>
      </label>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button id="btnSaveEngineConfig" class="kd-back-btn" style="background:var(--color-bar-mortal);">保存并重新检讨</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="kd-loading-overlay hidden">
    <div class="kd-spinner"></div>
    <div id="loadingTitle" style="font-size:15px; font-weight:bold;">正在分析牌谱...</div>
    <div id="loadingSub" style="font-size:12px; color:var(--color-text);">赤木神经网络正在检讨每一手决策</div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="kd-toast-wrap"></div>

  <script src="/app.js"></script>
</body>
</html>
