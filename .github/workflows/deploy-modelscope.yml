
name: Deploy to ModelScope Studio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# 避免多个部署同时执行
concurrency:
  group: modelscope-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 GitHub main 最新代码
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      # 2. 同步代码到 ModelScope
      - name: Push to ModelScope
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_OWNER: ${{ vars.MODELSCOPE_OWNER }}
          MODELSCOPE_STUDIO: ${{ vars.MODELSCOPE_STUDIO }}
        shell: bash
        run: |
          set -euo pipefail

          # 检查必要配置
          if [[ -z "${MODELSCOPE_API_KEY}" ]]; then
            echo "::error::MODELSCOPE_API_KEY 未配置"
            exit 1
          fi

          if [[ -z "${MODELSCOPE_OWNER}" || -z "${MODELSCOPE_STUDIO}" ]]; then
            echo "::error::ModelScope 项目配置不完整"
            exit 1
          fi

          git lfs install

          # 配置自动提交身份
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加 ModelScope 远程仓库
          git remote add modelscope \
            "https://oauth2:${MODELSCOPE_API_KEY}@modelscope.cn/studios/${MODELSCOPE_OWNER}/${MODELSCOPE_STUDIO}.git"

          # 获取 ModelScope 最新 master
          git fetch --no-tags modelscope \
            +refs/heads/master:refs/remotes/modelscope/master

          REMOTE_REF="refs/remotes/modelscope/master"

          # 检查是否存在共同历史
          if ! git merge-base HEAD "${REMOTE_REF}" >/dev/null; then
            echo "::error::GitHub 与 ModelScope 没有共同历史，停止同步以避免覆盖数据"
            exit 1
          fi

          # 如果 ModelScope 历史尚未包含在 GitHub HEAD 中，
          # 创建 ours 策略合并提交，保留 GitHub 当前完整文件内容。
          if git merge-base --is-ancestor "${REMOTE_REF}" HEAD; then
            echo "ModelScope 历史已经包含在 GitHub main 中，无需合并"
          else
            echo "检测到 ModelScope 存在额外提交，开始同步历史"

            git merge \
              --no-ff \
              -s ours \
              "${REMOTE_REF}" \
              -m "同步 ModelScope 历史并保留 GitHub 代码"

            echo "ModelScope 历史同步完成"
          fi

          # 普通推送，不使用强制推送
          git push modelscope HEAD:refs/heads/master

          echo "GitHub 代码已同步到 ModelScope"

      # 3. 通知 ModelScope 重新部署
      - name: Deploy ModelScope Studio
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_OWNER: ${{ vars.MODELSCOPE_OWNER }}
          MODELSCOPE_STUDIO: ${{ vars.MODELSCOPE_STUDIO }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${MODELSCOPE_API_KEY}" \
            "https://modelscope.cn/openapi/v1/studios/${MODELSCOPE_OWNER}/${MODELSCOPE_STUDIO}/deploy"

          echo "ModelScope deployment triggered successfully."
