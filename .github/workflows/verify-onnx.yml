name: 验证 Mortal S42 ONNX

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建并验证固定模型
        run: docker build -t majsoul-analyzer-onnx .
      - name: 验证真实模型分析
        run: docker run --rm majsoul-analyzer-onnx python -c "import json; from pathlib import Path; from server.engine.reviewer import EngineManager, review_game; m = EngineManager(Path('data/models')); events = json.loads(Path('data/demo_mjai.json').read_text(encoding='utf-8')); result = review_game(events, 0, m); assert any(k['decisions'] for k in result['kyokus']) and m.status()['model_ready']"
      - name: 牌谱转换与网络超时回归测试
        run: docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests/test_majsoul_connection_init.py tests/test_review_regressions.py tests/test_rating_kan_fixes.py tests/test_analysis_correctness.py"
      - name: 前端回放与交互回归测试
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_replay_timeline.py tests/test_replay_controls.py tests/test_on_demand_review.py
      - name: Pages 代理与管理员鉴权回归测试
        run: node --test tests/test_pages_proxy.mjs
