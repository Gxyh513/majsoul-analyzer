name: 验证 Mortal S42 ONNX

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建并验证固定模型
        run: docker build -t majsoul-analyzer-onnx .

      - name: 验证生产依赖锁定
        run: |
          docker run --rm majsoul-analyzer-onnx python -c "import subprocess; from pathlib import Path; actual=subprocess.check_output(['python', '-m', 'pip', 'freeze'], text=True).splitlines(); expected=[line for line in Path('requirements.lock.txt').read_text().splitlines() if line and not line.startswith('#')]; assert sorted(actual)==sorted(expected), '锁定依赖与镜像不匹配'"

      - name: 验证真实模型分析
        run: |
          docker run --rm majsoul-analyzer-onnx python -c "import json; from pathlib import Path; from server.engine.reviewer import EngineManager, review_game; m = EngineManager(Path('data/models')); events = json.loads(Path('data/demo_mjai.json').read_text(encoding='utf-8')); result = review_game(events, 0, m); assert any(k['decisions'] for k in result['kyokus']) and m.status()['model_ready']"

      - name: 本机模型 API 基线
        timeout-minutes: 5
        run: |
          docker run --rm -d --name majsoul-ci-baseline -e MAJSOUL_API_TOKEN=ci-local-only-benchmark -p 127.0.0.1:7860:7860 majsoul-analyzer-onnx
          trap 'docker rm -f majsoul-ci-baseline >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:7860/api/status -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:7860/api/status -o /dev/null
          docker run --rm --network host -e MAJSOUL_API_TOKEN=ci-local-only-benchmark majsoul-analyzer-onnx python -m scripts.benchmark_api --url http://127.0.0.1:7860 --requests 4 --concurrency 2

      - name: 核心后端回归测试
        run: |
          docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests --ignore=tests/test_frontend_regressions.py --ignore=tests/test_frontend_asset_loading.py --ignore=tests/test_on_demand_review.py --ignore=tests/test_replay_visual_fixes.py"

      - name: 前端回归与代理测试
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_frontend_regressions.py tests/test_frontend_asset_loading.py tests/test_on_demand_review.py tests/test_replay_visual_fixes.py
          node --test tests/test_pages_proxy.mjs tests/test_sse_browser_performance.mjs tests/test_sse_telemetry.mjs
          for file in web/js/*.js web/app.js; do node --check "$file" || exit 1; done
