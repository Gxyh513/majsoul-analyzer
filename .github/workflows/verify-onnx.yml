name: 验证 Mortal S42 ONNX

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建并验证固定模型
        run: docker build -t majsoul-analyzer-onnx .
      - name: 验证生产 Python 锁定版本与镜像完全一致
        run: docker run --rm majsoul-analyzer-onnx python -c "import subprocess; from pathlib import Path; actual=subprocess.check_output(['python', '-m', 'pip', 'freeze'], text=True).splitlines(); expected=[line for line in Path('requirements.lock.txt').read_text().splitlines() if line and not line.startswith('#')]; assert sorted(actual)==sorted(expected), '锁定依赖与生产镜像不匹配'"
      - name: 验证真实模型分析
        run: docker run --rm majsoul-analyzer-onnx python -c "import json; from pathlib import Path; from server.engine.reviewer import EngineManager, review_game; m = EngineManager(Path('data/models')); events = json.loads(Path('data/demo_mjai.json').read_text(encoding='utf-8')); result = review_game(events, 0, m); assert any(k['decisions'] for k in result['kyokus']) and m.status()['model_ready']"
      - name: 本机真实模型 API 基线（4 请求、并发 2）
        timeout-minutes: 5
        run: |
          docker run --rm -d --name majsoul-ci-baseline -e MAJSOUL_API_TOKEN=ci-local-only-benchmark -p 127.0.0.1:7860:7860 majsoul-analyzer-onnx
          trap 'docker rm -f majsoul-ci-baseline >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:7860/api/status -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:7860/api/status -o /dev/null
          docker run --rm --network host majsoul-analyzer-onnx python -m scripts.benchmark_api --url http://127.0.0.1:7860 --requests 4 --concurrency 2
          docker stats --no-stream --format '当前容器资源采样 CPU={{.CPUPerc}} 内存={{.MemUsage}}' majsoul-ci-baseline
      - name: 牌谱转换与网络超时回归测试
        run: docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests/test_majsoul_connection_init.py tests/test_review_regressions.py tests/test_rating_kan_fixes.py tests/test_analysis_correctness.py tests/test_auto_register.py tests/test_review_execution.py tests/test_review_cache.py tests/test_ops_metrics.py tests/test_benchmark_replay.py tests/test_benchmark_api.py"
      - name: 存储路径、账号池及复盘回归测试
        run: docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests/test_storage_paths.py tests/test_account_env_pool.py tests/test_account_pool_failover.py tests/test_record_session.py tests/test_record_reanalysis.py tests/test_chinese_json_logging.py tests/test_sqlite_loop.py"
      - name: 前端回放与交互回归测试
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_replay_timeline.py tests/test_replay_controls.py tests/test_on_demand_review.py tests/test_replay_visual_fixes.py
      - name: Pages 代理与管理员鉴权回归测试
        run: |
          docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests/test_security_regressions.py"
          node --test tests/test_pages_proxy.mjs
      - name: 原始牌谱备份工具回归测试
        run: docker run --rm majsoul-analyzer-onnx sh -c "python -m pip install -q pytest && python -m pytest -q tests/test_backup_records.py"
