name: 构建 Mortal S42 后端镜像

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建生产镜像并验证固定 ONNX 模型
        run: docker build -t majsoul-analyzer:ci .

      - name: 检查 Python 源码语法
        run: docker run --rm majsoul-analyzer:ci python -m compileall -q server run.py

      - name: 检查应用模块导入与 API 路由注册
        run: |
          docker run --rm majsoul-analyzer:ci python -c "from server.app import app; schema = app.openapi(); print('FastAPI routes:', len(app.routes), 'OpenAPI paths:', len(schema.get('paths', {})))"
