name: 线上服务可用性监测

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 检查公开状态及 Mortal 模型就绪
        env:
          HEALTH_URL: https://majsoul.ccwu.cc/api/status
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["HEALTH_URL"]
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json", "Cache-Control": "no-cache"},
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.load(response)
                  engine = payload.get("engine") or {}
                  if payload.get("ok") is True and engine.get("has_mortal_weights") is True:
                      print("线上服务响应正常，Mortal S42 模型已就绪")
                      break
                  print("线上状态未就绪，尝试", attempt, "/3")
              except (OSError, ValueError, TypeError, urllib.error.URLError) as exc:
                  print("健康检查失败，尝试", attempt, "/3:", type(exc).__name__)
              if attempt < 3:
                  time.sleep(10)
          else:
              raise SystemExit("线上服务或 Mortal 模型仍不可用")
          PY
